name: Build icons
on:
  push:
    branches: [gh-pages]
    paths: [make_icons.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python make_icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Build icons" && git push)
